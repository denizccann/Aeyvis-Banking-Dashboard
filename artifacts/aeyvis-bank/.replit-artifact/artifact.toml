kind = "web"
previewPath = "/"
title = "Aeyvis Bank Dashboard"
version = "1.0.0"
id = "artifacts/aeyvis-bank"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20728

[services.development]
run = "pnpm --filter @workspace/aeyvis-bank run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aeyvis-bank", "run", "build" ]
publicDir = "artifacts/aeyvis-bank/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20728"
BASE_PATH = "/"
